name: Cut release tag

# Cutting a release is "tag main's tip and push the tag" (docs/releasing.md). This does it on a
# runner, with the checks scripts/tag_release.py exists to run, so a release does not depend on
# which machine someone is at -- and so a sandboxed session that cannot push tags can still cut
# one (ADR 0006):
#
#   1. scripts/release_channel.py    -- stable / alpha / beta / rc from the version string.
#   2. scripts/changelog_section.py  -- stable only: the release notes render (section exists,
#                                       is not duplicated, [Unreleased] is empty).
#   3. scripts/tag_release.py        -- clean tree at origin/main, no tag already on HEAD, PEP 440
#                                       short form, sequential with no gaps.
#
# dry_run defaults to TRUE: every check runs and the tag is created on the runner only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag, e.g. 1.2.0 (stable) or 1.2.0a1 / 1.2.0b2 / 1.2.0rc1'
        required: true
        type: string
      dry_run:
        description: 'Run every check and create the tag locally, but do NOT push it'
        required: false
        default: true
        type: boolean

# The GITHUB_TOKEN cannot do this job's one write: a tag it pushes starts no workflow. The checkout
# authenticates with RELEASE_TAG_TOKEN instead, and the GITHUB_TOKEN stays read-only.
permissions:
  contents: read
  actions: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    # A place to hang a required reviewer (Settings -> Environments -> release).
    environment: release
    steps:
      - name: Check the release token is configured
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "${RELEASE_TAG_TOKEN}" ]; then
            echo "::error::RELEASE_TAG_TOKEN is not set. It cannot be the GITHUB_TOKEN: a tag pushed"
            echo "::error::with that starts no build.yml. See docs/releasing.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main          # a release is cut from main's tip, never the dispatching ref
          fetch-depth: 0     # tag_release.py needs every tag for its sequence check
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Resolve release channel
        id: channel
        env:
          VERSION: ${{ inputs.version }}   # through the environment, so an input cannot inject shell
        run: |
          CHANNEL="$(python3 scripts/release_channel.py "$VERSION")"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION resolves to the $CHANNEL channel"

      - name: Render release notes
        if: steps.channel.outputs.channel == 'stable'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "### Release notes for $VERSION" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/changelog_section.py "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/tag_release.py "$VERSION"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/tag_release.py "$VERSION" --push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # The failure this guards is silent: a tag pushed with the wrong credential looks like a
      # release and starts nothing. So ask whether the thing the tag exists to start started.
      - name: Verify the tag started build.yml
        if: steps.tag.outputs.pushed == 'true'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 12); do
            FOUND="$(curl -sS --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?event=push&per_page=20" \
              | jq -r --arg sha "$SHA" '[.workflow_runs[]? | select(.head_sha == $sha) | .html_url] | first // empty')" || true
            if [ -n "$FOUND" ]; then
              echo "build.yml started: $FOUND" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Tag v$VERSION was pushed, but no build.yml run appeared for $SHA within 2 minutes."
          echo "::error::The tag exists and the release did NOT start. Check RELEASE_TAG_TOKEN, then delete and re-push the tag."
          exit 1

      - name: Summary
        if: always() && steps.tag.conclusion == 'success'
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PUSHED: ${{ steps.tag.outputs.pushed }}
        run: |
          {
            echo "## v$VERSION ($CHANNEL)"
            if [ "$PUSHED" = "true" ]; then
              echo "Tag pushed. build.yml is running."
            else
              echo "**Dry run**: every check passed and the tag was created on the runner only."
              echo 'Re-dispatch with `dry_run: false` to cut this release for real.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
