name: Build and publish

# Layer 6 of docs/testing-policy.md, and the release pipeline of docs/releasing.md.
#
# A v* tag push builds, smoke-tests and publishes. A workflow_dispatch builds and smoke-tests the
# chosen commit and publishes NOTHING: every publish job is gated on a tag ref. That dispatched
# run is the pre-flight /cut-release runs before tagging (ADR 0006).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools_scm resolves the version from the tag (ADR 0004)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Off a tag there is no channel: nothing will be published.
      - name: Determine release channel
        id: channel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "channel=$(python3 scripts/release_channel.py "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
          else
            echo "channel=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      # A tag build that resolves to a dev version would publish the wrong thing (a commit with two
      # tags, or tags missing from the checkout). Refuse it here, before anything else runs.
      - name: Check the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ls dist/
          compgen -G "dist/*-${expected}-py3-none-any.whl" > /dev/null || {
            echo "::error::Built version does not match tag ${GITHUB_REF_NAME}. Does the commit carry two release tags?"
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Install the wheel into a clean venv, with the repository's src/ off the path, and prove the
  # installed entry point speaks MCP over stdio.
  smoke:
    needs: build
    name: Packaged smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pkg"
          if [ -x "$RUNNER_TEMP/pkg/bin/python" ]; then PY="$RUNNER_TEMP/pkg/bin/python"; else PY="$RUNNER_TEMP/pkg/Scripts/python.exe"; fi
          "$PY" -m pip install dist/*.whl pytest pytest-asyncio pytest-timeout
          echo "PKG_PY=$PY" >> "$GITHUB_ENV"
      - name: Run the packaged smoke test
        shell: bash
        env:
          PACKAGED_PYTHON: ${{ env.PKG_PY }}
        # --rootdir keeps the repo's conftest, but -p no:cacheprovider and the import check in the
        # test make sure the package comes from the installed wheel, not from src/.
        run: '"$PKG_PY" -m pytest -v -m packaged -p no:cacheprovider tests/packaged'

  publish-testpypi:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC trusted publishing; no token in the repo (ADR 0009)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, publish-testpypi]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)

  # All-or-nothing: runs only after every smoke leg passed (and, for a stable tag, after PyPI).
  github-release:
    needs: [build, smoke, publish-pypi]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success' && needs.smoke.result == 'success'
      && (needs.publish-pypi.result == 'success' || needs.build.outputs.channel != 'stable')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Stable: the body is CHANGELOG.md's section, and a missing/duplicated section or a populated
      # [Unreleased] fails here rather than shipping wrong notes (ADR 0005).
      - name: Render release notes
        if: needs.build.outputs.channel == 'stable'
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > release-notes.md
      - name: Pre-release notes
        if: needs.build.outputs.channel != 'stable'
        run: echo "Pre-release ${GITHUB_REF_NAME}. Changes are listed under [Unreleased] in CHANGELOG.md." > release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.build.outputs.channel != 'stable' }}
          files: dist/*
          fail_on_unmatched_files: true
