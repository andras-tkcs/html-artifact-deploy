[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "html-artifact-deploy"
# The version comes from the git tag through setuptools_scm and nowhere else; there is no version
# string in the source tree and no version-bump commit (docs/releasing.md, ADR 0004).
dynamic = ["version"]
description = "An MCP server that deploys HTML artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AT", email = "at+github@felhasznalo.name" }]
keywords = ["mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # The official SDK serves the protocol; the transport is not hand-rolled (ADR 0003). 2.x's
    # server API is not additive over 1.x, hence the floor and the ceiling.
    "mcp>=2.2,<3.0.0",
    # Imported directly by http_app.py and __main__.py; mcp already installs both (ADR 0019).
    "starlette>=1.0,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.urls]
Homepage = "https://github.com/andras-tkcs/html-artifact-deploy"
Issues = "https://github.com/andras-tkcs/html-artifact-deploy/issues"
Changelog = "https://github.com/andras-tkcs/html-artifact-deploy/blob/main/CHANGELOG.md"

[project.scripts]
html-artifact-deploy = "html_artifact_deploy.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
]
dev = ["html-artifact-deploy[test,lint]", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Only ever seen by a checkout with no tags (a shallow clone, a tarball). Never a shipped version.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
# One marker per layer of docs/testing-policy.md. A new test module carries the marker of its layer.
markers = [
    "unit: fast, fully offline, one module in isolation",
    "integration: the real server over a real MCP transport, no external network",
    "client: a real, pinned AI-client CLI against the server",
    "live: touches the real upstream service (self-hosted runner only)",
    "packaged: runs against a built wheel/sdist installed into a clean environment",
]

[tool.coverage.run]
branch = true
source = ["src/html_artifact_deploy"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# The strictness ratchet: scripts/mypy_strict_modules.py re-runs mypy, blocking, over every module
# listed in an override like this one. Promote a module by adding a block once it is clean.
[[tool.mypy.overrides]]
module = [
    "html_artifact_deploy.server",
    "html_artifact_deploy.config",
    "html_artifact_deploy.pages",
    "html_artifact_deploy.storage",
    "html_artifact_deploy.state",
    "html_artifact_deploy.page_index",
    "html_artifact_deploy.service",
    "html_artifact_deploy.google_oidc_client",
    "html_artifact_deploy.token_store",
    "html_artifact_deploy.oauth_provider",
    "html_artifact_deploy.http_app",
    "html_artifact_deploy.uploads",
    "html_artifact_deploy.__main__",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
